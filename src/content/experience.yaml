# Experience on the homepage, newest first. Bullets may hold inline HTML (links).
- id: tech-lead
  order: 1
  title: Tech lead infrastructure
  years: 2024–now
  intro: The platform I started became the standard for our clients, and running it now means leading the team behind it.
  bullets:
    - I lead the infra team, up to four engineers. A normal week is reviewing their changes, making architecture decisions, mentoring and handling client contact and escalations.
    - 'I run the <a href="/projects/hosting-platform/">hosting platform</a>: 8 Kubernetes clusters for Dutch and international clients on AWS (Ireland and Tokyo) and Azure. The largest runs more than 1,500 pods, and every app deploys through Argo CD.'
    - I’m moving infrastructure delivery to Pulumi. We also moved the clusters to IPv6-only, which didn’t go without problems (<a href="#learned">one of them below</a>).
    - I run training programmes with clients and internal knowledge sessions. As security officer for ISO 27001, I maintain the policies, the audits and the management system.
  learned: "What I learned: an hour spent on a review or a training session pays off more than an hour spent fixing things myself."
- id: infra-engineer
  order: 2
  title: Infrastructure engineer
  years: 2020–2024
  intro: Once I knew my way around AWS and networking, I moved into infrastructure full time and started the platform I run today.
  bullets:
    - I designed architectures and networks, which I like because each one is a puzzle.
    - I put our Jenkins in code, then the rest of the company’s infrastructure, including the serverless foundations on AWS.
    - "I started our hosting platform: a multi-year project that replaced a separate setup per client with one shared standard."
    - I built internal tooling, such as a CLI that gets anyone into any environment with the right role.
  learned: "What I learned: one standard platform, fully in code, is easier to change and support than a custom setup for every client."
- id: backend
  order: 3
  title: Back-end and serverless developer
  years: 2017–2020
  intro: From the front end I moved to the back end, where my code started to depend on the infrastructure it ran on.
  bullets:
    - I piloted Python as a language at Harborn and used it for most of my back-end work.
    - I introduced infrastructure as code and serverless on AWS (Lambda, CloudWatch, S3, Aurora), with CI/CD automation to deploy it.
    - I worked on a worldwide B2B ordering platform.
  learned: "What I learned: AWS and networking, which is what pulled me towards infrastructure."
- id: frontend
  order: 4
  title: Front-end developer, intern then junior
  years: 2016–2017
  intro: I started at Harborn as a front-end intern and stayed on as a junior developer.
  bullets:
    - Most of my work was in Angular.
    - "For my internship I built a complete website: I researched headless CMSes first, then implemented one."
  learned: "What I learned: how to take a website from the first technical choice to a finished build."
