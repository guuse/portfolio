# What I've learned: four things I work by, each with an example from the platform.
- id: teaching
  order: 1
  title: Teaching the team
  text: When I fix something myself, nobody else learns from it. So I’d rather explain it in a review or a knowledge session, and next time the team handles it without me.
- id: approved-applied
  order: 2
  title: Approved should mean applied
  text: A reviewer approves the exact plan a change will make, and the pipeline applies only that plan. If production has changed since the review, the deploy stops instead of applying something nobody reviewed.
- id: wrong-change
  order: 3
  title: Make the wrong change impossible
  text: If a runbook has to warn about something twice, it should be a policy instead. On our log bucket, for example, a policy rejects the expiry rule a reviewer would otherwise approve as cost control.
- id: blast-radius
  order: 4
  title: Size the blast radius first
  text: Every environment gets its own state, key and deploy role, so a test deploy can’t touch production. A lost state file then costs one subsystem, not the whole platform.
