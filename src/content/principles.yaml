# What I've learned: four things I work by. Kept short: the case studies tell the stories behind them.
- id: teaching
  order: 1
  title: Explaining what I fix
  text: When I fix something, I explain why in the pull request or in a knowledge session, so the fix doesn’t stay in my head.
- id: approved-applied
  order: 2
  title: Reviewing what gets applied
  text: A reviewer approves the plan the pipeline saved, and the deploy applies that plan and nothing else.
- id: wrong-change
  order: 3
  title: Turning warnings into policy
  text: If a runbook has to warn about something twice, I write a policy that fails the pull request instead.
- id: blast-radius
  order: 4
  title: Checking what a change costs
  text: Since our move to IPv6 made internal traffic expensive, I check what a network change costs as well as whether it works.
