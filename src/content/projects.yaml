# The three case studies, in the order they're shown. `card` is the homepage card line,
# `line` the one on the projects page. `published` and `updated` are the case study's dates
# (its Article JSON-LD): bump `updated` when a case study's copy changes.
- id: hosting-platform
  order: 1
  title: Hosting platform
  meta: Work · 2022 to now
  card: The Kubernetes platform that runs our client projects on AWS and Azure.
  line: The Kubernetes platform that runs our client projects on AWS and Azure.
  why: Every client project used to have its own setup, so every upgrade was a separate job. I started one platform built from the same modules, and it now hosts more than 300 clients with over 800 deployments.
  facts:
    - EKS on a dual-stack VPC, in production across three availability zones
    - A second region in Tokyo, for lower latency to customers in Asia
    - 8 Kubernetes clusters, the largest with more than 1,500 pods
    - Terraform and OpenTofu modules, with new infrastructure moving to Pulumi
  stack: AWS (EKS, Aurora, Redis, OpenSearch, CloudFront), Azure (AKS), Karpenter, cert-manager, Velero, Terraform, OpenTofu, Pulumi, Argo CD
  published: "2026-11-03"
  updated: "2026-11-04"
- id: homelab
  order: 2
  title: Homelab
  meta: Personal · 2026
  card: k3s and Argo CD on an old laptop at home, deployed the way we deploy at work.
  line: k3s and Argo CD on an old laptop at home, deployed the way we deploy at work.
  why: I wanted a place to try things before I suggest them at work. It also runs my side projects, including the MTG tools.
  facts:
    - From git push to running with no manual step, through Argo CD Image Updater
    - 15 apps, all managed from one repo
    - Private over Tailscale; a few apps are public through a Cloudflare Tunnel
    - Proxmox on 16 GB, with Home Assistant in its own VM
  stack: Proxmox, k3s, Argo CD, GitHub Actions, GHCR, Traefik, cert-manager, Tailscale, Cloudflare, Home Assistant
  published: "2026-11-03"
  updated: "2026-11-04"
- id: mtg-suite
  order: 3
  title: MTG suite
  meta: Personal · 2026
  card: A Commander table in the browser and a deck library, for my friends and me.
  line: Tools my friends and I use to learn Commander, keep our decks and play online when we can’t meet up.
  why: My friends and I play Commander, so I built us a table in the browser and a deck library to go with it.
  facts:
    - "Rules of 99: Commander in the browser for two to four players"
    - "Tutor: our deck library, with shared playgroup collections"
    - Decks go from Tutor straight to a seat in Rules of 99
    - "Scryfall, in plain words: card search without the syntax"
  stack: Java, React, TypeScript, WebSockets, Node, SQLite
  published: "2026-11-03"
  updated: "2026-11-04"
