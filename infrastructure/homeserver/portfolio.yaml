# For guuse/homeserver: argocd/applications/portfolio.yaml
#
# portfolio (guuse/portfolio): ekkelenkamp.dev, a static Astro site on an
# unprivileged nginx. Two stateless pods. App manifests live in the app repo
# under infrastructure/ (Kustomize, on main); here is the Argo CD Application +
# the Image Updater CR.
#
# Reachability: PUBLIC at https://ekkelenkamp.dev (www.ekkelenkamp.dev 301s to
# it) through the Cloudflare Tunnel -> Traefik -> the wildcard TLSStore. The
# first tunnel hostname with deliberately NO Cloudflare Access policy: it is a
# public website with no login, no API and nothing that spends anything.
#
# OUT-OF-BAND, one-time before first sync (guuse/portfolio infrastructure/README.md):
#   - Make the GHCR package ghcr.io/guuse/portfolio public (the repo is public), so
#     the kubelet needs no pull secret. Image Updater's registry credential still
#     lists its tags.
#   - Tunnel public hostnames ekkelenkamp.dev + www.ekkelenkamp.dev ->
#     https://traefik.kube-system.svc.cluster.local:443 (Origin Server Name = hostname).
#   - Ensure the Argo CD repo credential can Contents:write guuse/portfolio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
spec:
  project: homeserver
  source:
    repoURL: https://github.com/guuse/portfolio.git
    targetRevision: main
    path: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Image Updater (v1.x, CRD-based): follow the newest commit-SHA tag on GHCR and
# write it into infrastructure/kustomization.yaml (images:) on main -> Argo CD
# rolls out. writeBackTarget is relative to the Application's source path, so
# "kustomization:." means infrastructure/kustomization.yaml. The release
# workflow in guuse/portfolio ignores that file, so this write-back never
# re-triggers a build.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: portfolio
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: portfolio
      writeBackConfig:
        method: "git:secret:argocd/git-creds"
        gitConfig:
          repository: https://github.com/guuse/portfolio.git
          branch: main
          writeBackTarget: "kustomization:."
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: "regexp:^[0-9a-f]{40}$"
        pullSecret: "pullsecret:argocd/ghcr"
      images:
        - alias: web
          imageName: ghcr.io/guuse/portfolio
          manifestTargets:
            kustomize:
              name: ghcr.io/guuse/portfolio
