# nginx for ekkelenkamp.dev: a static Astro build, served by an unprivileged
# nginx on a read-only root filesystem. Only /tmp is writable (an emptyDir in
# the pod, a tmpfs under `docker run --read-only`). TLS ends at Traefik, so
# this listens on plain HTTP 8080 and never sees a certificate.

worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # Every temp path nginx might write to lives on the one writable mount.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    include /etc/nginx/portfolio/mime-extra.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript
                  application/json application/manifest+json image/svg+xml;

    # No IP addresses in the access log: nothing to anonymise, nothing to leak.
    log_format portfolio '$time_iso8601 "$request" $status $body_bytes_sent '
                         '$request_time "$http_referer" "$http_user_agent"';
    access_log /dev/stdout portfolio;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1k;   # static site: nothing to upload

    # Text assets are gzipped at image build time (Dockerfile); anything that
    # was not is compressed on the fly. Brotli/zstd to browsers happen at the
    # Cloudflare edge.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml image/x-icon;

    # Cache policy by path. Astro fingerprints everything under /_astro/, so it
    # is immutable; HTML always revalidates so a deploy is visible at once.
    map $uri $portfolio_cache_control {
        ~^/_astro/                    "public, max-age=31536000, immutable";
        ~(\.html|/)$                  "public, max-age=0, must-revalidate";
        /healthz                      "no-store";
        default                       "public, max-age=3600";
    }

    # www is an alias, not a second site.
    server {
        listen 8080;
        server_name www.ekkelenkamp.dev;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            return 301 https://ekkelenkamp.dev$request_uri;
        }
    }

    server {
        listen 8080 default_server;
        server_name ekkelenkamp.dev;

        root /srv/portfolio;
        index index.html;

        # Directory URLs (Astro's trailing-slash routes) redirect with a
        # relative Location, so the internal port never shows up in a URL.
        absolute_redirect off;

        include /etc/nginx/portfolio/security-headers.conf;
        add_header Cache-Control $portfolio_cache_control always;

        error_page 404 /404.html;

        location / {
        }

        location = /404.html {
            internal;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # RFC 2324, section 2.3.2.
        location = /coffee {
            default_type text/plain;
            return 418 "418 I'm a teapot. The cluster only brews static files.\n";
        }

        # No dotfiles, except the well-known ones (security.txt).
        location ~ /\.(?!well-known/) {
            return 404;
        }
    }
}
