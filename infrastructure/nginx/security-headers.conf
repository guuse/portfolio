# Response headers for every page and asset. Included at server level only:
# an add_header inside a location would silently drop all of these, so the
# locations in nginx.conf deliberately set none.

# The CSP is split by what each layer can know (infrastructure/README.md, "CSP"):
#  - Astro writes a per-page <meta http-equiv="content-security-policy"> with
#    default-src 'none' and sha256 hashes for every inline script and style.
#  - This header carries what a <meta> policy cannot (frame-ancestors) plus a
#    backstop for the rest. It has no default-src/script-src/style-src on
#    purpose: browsers enforce both policies, and a header without the page's
#    hashes would block Astro's hashed inline module scripts.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; upgrade-insecure-requests" always;

# .dev is on the HSTS preload list as a whole TLD; this says the same for us.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# A man is not dead while his name is still spoken.
add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
