name: ci

on:
  pull_request:
  push:
    # main is covered by release.yml, which calls this workflow before it builds.
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No Astro telemetry from CI.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, format, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tokens
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build, e2e, a11y and Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright's own image has the three browsers and their system libraries, so no step
    # downloads them (the runner's apt mirror once took over 8 minutes for those libraries).
    # Keep its version equal to @playwright/test; the first step below checks that.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: The image has the browsers this @playwright/test expects
        run: >-
          node -e "const pw = require('@playwright/test'); const fs = require('fs');
          for (const b of [pw.chromium, pw.firefox, pw.webkit]) fs.accessSync(b.executablePath())"
          || { echo "::error::Set the Playwright image in ci.yml to this @playwright/test version"; exit 1; }
      # the runner sets HOME to a folder it owns, and Firefox won't start as root with that
      - run: npm run test:e2e
        env:
          CI: "1"
          HOME: /root
      - run: npm run test:a11y
        env:
          CI: "1"
          HOME: /root
      - name: Lighthouse (budget in lighthouserc.cjs)
        # on Playwright's Chromium from the image
        run: |
          CHROME_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")"
          export CHROME_PATH
          npx lhci autorun
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
