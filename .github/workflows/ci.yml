name: ci

on:
  pull_request:
  push:
    # main is covered by release.yml, which calls this workflow before it builds.
    branches-ignore: [main]
  # release.yml calls this before it builds the image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Astro collects no telemetry in CI, and neither does anything else here.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, format, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tokens
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build, e2e, a11y and Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - run: npm run test:a11y
        env:
          CI: "1"
      - name: Lighthouse (budget in lighthouserc.cjs)
        # on Playwright's Chromium, which the step above installed
        run: |
          CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          export CHROME_PATH
          npx lhci autorun
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
